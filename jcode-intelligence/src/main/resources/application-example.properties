spring.application.name=jcode-intelligence

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jcode_db?preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5&prepareThreshold=1
spring.datasource.username=postgres
spring.datasource.password=postgres

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Use Ollama for embeddings
spring.ai.model.embedding=ollama

# Groq
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=gsk_futalovingcockmaster;)
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Docker
spring.docker.compose.file=jcode-intelligence/compose.yaml

# Retrieval Filtering
astra.retrieval.similarity-threshold=0.50
astra.retrieval.raw-top-k=20
astra.retrieval.default-top-k=5
astra.retrieval.architecture-top-k=20
astra.retrieval.summary-top-k=50

# Retrieval Strategy & Hybrid Fusion (Lucene BM25 + Reciprocal Rank Fusion)
# Strategy selection: DENSE, SPARSE, or HYBRID (default: HYBRID)
astra.retrieval.strategy=HYBRID
# Master switch for Lucene sparse inverted index (if false, falls back to dense vector retrieval)
astra.retrieval.sparse.enabled=true
# Base directory for generational Lucene sparse inverted indexes
astra.retrieval.sparse.index-dir=data/sparse-index
# BM25 term frequency saturation parameter (k1 >= 0, default: 1.2)
astra.retrieval.sparse.k1=1.2
# BM25 document length normalization parameter (0 <= b <= 1, default: 0.75)
astra.retrieval.sparse.b=0.75
# Minimum term character length required before Levenshtein fuzzy query expansion (default: 4)
astra.retrieval.sparse.fuzzy-min-term-length=4
# Maximum Levenshtein edit distance for fuzzy term matching (0, 1, or 2; default: 1)
astra.retrieval.sparse.fuzzy-max-edits=1
# Lucene field boost weights for Boolean scoring
astra.retrieval.sparse.boost.content=1.0
astra.retrieval.sparse.boost.element-name=4.0
astra.retrieval.sparse.boost.class-name=2.0
astra.retrieval.sparse.boost.file-path=1.5
astra.retrieval.sparse.boost.signature=1.5
# Reciprocal Rank Fusion (RRF) smoothing constant k (k >= 1, default: 60)
astra.retrieval.rrf.k=60
# Default RRF candidate weights (used when intent-specific weight overrides are not configured)
astra.retrieval.rrf.weight.dense=0.5
astra.retrieval.rrf.weight.sparse=0.5
# Asynchronous retrieval executor core pool size (default: 4)
astra.retrieval.executor.core-pool-size=4
#
# Heuristic Reranking & Strategy Selection
astra.retrieval.rerank.strategy=heuristic
astra.retrieval.rerank.w-retrieval=10.0
astra.retrieval.rerank.w-symbol=1.0
astra.retrieval.rerank.w-completeness=1.0
astra.retrieval.rerank.neutral-retrieval-score=0.5
#
# Opt-In Cross-Encoder Reranking Cascade (ONNX Runtime + HuggingFace Tokenizer)
# Master switch (default: false). When true, top candidates from heuristic reranking
# are batch-scored using a neural cross-encoder model.
astra.reranker.cross-encoder.enabled=false
# Path to ONNX model artifact (e.g. ms-marco-MiniLM-L-6-v2.onnx or bge-reranker-base.onnx)
astra.reranker.cross-encoder.model-path=models/ms-marco-MiniLM-L-6-v2.onnx
# Path to HuggingFace tokenizer.json file
astra.reranker.cross-encoder.tokenizer-path=models/tokenizer.json
# Maximum token sequence length for query-chunk pairs (default: 512)
astra.reranker.cross-encoder.sequence-length=512
# Maximum candidate prefix to rerank via cross-encoder (default: 10; remainder preserves heuristic order)
astra.reranker.cross-encoder.max-candidates=10
#
# OPERATIONAL NOTICE:
# Upgrading to HYBRID or SPARSE retrieval requires re-indexing existing repositories
# ('reindex' command in CLI or POST /api/v1/index) to populate the Lucene inverted index
# generations under 'data/sparse-index'. If a generation is missing or sparse search is
# disabled, ASTra automatically and safely falls back to dense vector retrieval without error.

# Prompt Context Budget
astra.prompt.max-context-documents=20
astra.prompt.max-context-size=18000
astra.prompt.reserved-response-size=2000

# Adaptive Parallel Batch Embedding (STEP 6)
astra.embedding.batch-size=100
astra.embedding.max-parallel-workers=4

# Shared Embedding Queue & Persistence (Issues #30 & #47)
astra.indexing.embedding-queue.capacity=2000
astra.indexing.persistence.batch-size=500
astra.indexing.persistence.min-batch-size=10
astra.indexing.persistence.flush-interval-ms=3000
# Background persistence writer count (default: 1; increase to 2 or 4 for parallel multi-threaded database writes)
astra.indexing.persistence.writer-count=2
astra.indexing.persistence.max-retries=3
astra.indexing.persistence.retry-backoff-ms=100

# Dynamic Wave Batch Accumulation (Issue #49)
# Enables dynamic batch accumulation to coalesce parallel worker waves into single PGVector writes
astra.indexing.persistence.dynamic-batching.enabled=true
# Fallback target batch size when job concurrency hints are unavailable
astra.indexing.persistence.dynamic-batching.adaptive-target-size=400
# Minimum quiet window in milliseconds before partial wave flush
astra.indexing.persistence.dynamic-batching.quiet-window-min-ms=3500
# Maximum quiet window in milliseconds before partial wave flush
astra.indexing.persistence.dynamic-batching.quiet-window-max-ms=5000
# Maximum waiting time in milliseconds for the oldest buffered record before mandatory flush
astra.indexing.persistence.dynamic-batching.max-wait-ms=10000

# Memory-Aware Repository Classification & Pipeline Selection (Issue #29)
# Share of JVM max heap allocated for holding ASTs and chunks in memory (0.0 to 1.0)
astra.indexing.memory.budget-fraction=0.4
# Calibrated workload memory factor: estimated live heap per line of code (in bytes)
astra.indexing.memory.bytes-per-loc=600
# Optional manual threshold override: if commented out, classification is 100% dynamic
# based on real-time JVM max heap: (maxMemory * budget-fraction) / bytes-per-loc.
# astra.indexing.loc.normal-threshold=500000

# Large-Repository Streaming Indexing Pipeline (Issue #31)
# Base chunk batch size floor per streaming wave for repositories classified as LARGE.
# Scope: LARGE repository streaming pipeline only (has no effect on NORMAL repositories).
# When running, the streaming pipeline dynamically scales the pass threshold upward
# based on real-time available JVM heap and budget-fraction (e.g. 40,000+ chunks on 3GB heap).
astra.indexing.large-repo.batch-size=2000
# Real-time safety headroom fraction: triggers an early wave flush if available heap drops below this fraction of max heap (default: 0.25, i.e. 25% safety reserve).
astra.indexing.large-repo.safety-headroom-fraction=0.25

# LLM Generation Evaluation & Semantic Judge
# Master switch for generation evaluation in benchmarks (default: false)
astra.evaluation.enabled=false
# Maximum retry attempts for transient LLM errors (429, 5xx, TransientAiException)
astra.evaluation.retry.max-attempts=3
# Initial exponential backoff delay in milliseconds
astra.evaluation.retry.initial-delay-ms=1000
# Exponential backoff multiplier
astra.evaluation.retry.multiplier=2.0
# Maximum retry backoff delay ceiling in milliseconds
astra.evaluation.retry.max-delay-ms=10000
# Mandatory quiet delay between consecutive LLM judge calls in milliseconds
astra.evaluation.delay-between-calls-ms=500
# Optional judge temperature override (deterministic evaluation defaults to 0.0)
astra.evaluation.temperature=0.0
