spring.application.name=jcode-intelligence

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jcode_db?preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=5&prepareThreshold=1
spring.datasource.username=postgres
spring.datasource.password=postgres

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Use Ollama for embeddings
spring.ai.model.embedding=ollama

# Groq
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=gsk_futalovingcockmaster;)
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Docker
spring.docker.compose.file=jcode-intelligence/compose.yaml

# Retrieval Filtering
astra.retrieval.similarity-threshold=0.65
astra.retrieval.raw-top-k=20
astra.retrieval.default-top-k=5
astra.retrieval.architecture-top-k=20
astra.retrieval.summary-top-k=50

# Prompt Context Budget
astra.prompt.max-context-documents=20
astra.prompt.max-context-size=18000
astra.prompt.reserved-response-size=2000

# Adaptive Parallel Batch Embedding (STEP 6)
astra.embedding.batch-size=100
astra.embedding.max-parallel-workers=4

# Shared Embedding Queue & Persistence (Issues #30 & #47)
astra.indexing.embedding-queue.capacity=2000
astra.indexing.persistence.batch-size=500
astra.indexing.persistence.min-batch-size=10
astra.indexing.persistence.flush-interval-ms=3000
astra.indexing.persistence.writer-count=1
astra.indexing.persistence.max-retries=3
astra.indexing.persistence.retry-backoff-ms=100

# Dynamic Wave Batch Accumulation (Issue #49)
# Enables dynamic batch accumulation to coalesce parallel worker waves into single PGVector writes
astra.indexing.persistence.dynamic-batching.enabled=true
# Fallback target batch size when job concurrency hints are unavailable
astra.indexing.persistence.dynamic-batching.adaptive-target-size=400
# Minimum quiet window in milliseconds before partial wave flush
astra.indexing.persistence.dynamic-batching.quiet-window-min-ms=3500
# Maximum quiet window in milliseconds before partial wave flush
astra.indexing.persistence.dynamic-batching.quiet-window-max-ms=5000
# Maximum waiting time in milliseconds for the oldest buffered record before mandatory flush
astra.indexing.persistence.dynamic-batching.max-wait-ms=10000
