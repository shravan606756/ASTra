spring.application.name=jcode-intelligence

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/jcode_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Use Ollama for embeddings
spring.ai.model.embedding=ollama

# Groq
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=gsk_futalovingcockmaster;)
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Docker
spring.docker.compose.file=jcode-intelligence/compose.yaml

# Retrieval Filtering
astra.retrieval.similarity-threshold=0.65
astra.retrieval.raw-top-k=20
astra.retrieval.default-top-k=5
astra.retrieval.architecture-top-k=20
astra.retrieval.summary-top-k=50

# Prompt Context Budget
astra.prompt.max-context-documents=20
astra.prompt.max-context-size=18000
astra.prompt.reserved-response-size=2000

# Adaptive Parallel Batch Embedding (STEP 6)
astra.embedding.max-parallel-workers=4